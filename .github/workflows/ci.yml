name: Search Nolc CI
on: {push: {branches: [main]}, pull_request: {branches: [main]}}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Nolc image
        run: docker build -t noliae-search .
      - name: Smoke test MVC routes
        run: |
          docker run -d --name search -p 8081:8080 noliae-search
          for i in $(seq 1 20); do curl -fsS http://localhost:8081/ && break || sleep 1; done
          curl -fsS http://localhost:8081/recherche?q=Noliae | grep -q 'Noliae Search'
          curl -fsS http://localhost:8081/api/health | grep -q 'nolc'
          curl -fsS http://localhost:8081/robots.txt | grep -q 'Sitemap'
          curl -fsS http://localhost:8081/sitemap.xml | grep -q 'noliae.com'
          docker rm -f search
